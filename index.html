<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Tree Manager</title>
<link rel="stylesheet" href="css/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌳</text></svg>">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">۞</span>
    <div class="brand-text">
      <h1 id="treeTitle">Family Tree</h1>
      <p id="treeSubtitle"></p>
    </div>
  </div>

  <div class="search-wrap">
    <input id="search" type="search" placeholder="Search anyone…" autocomplete="off"
           aria-label="Search people" aria-expanded="false" role="combobox" aria-controls="searchResults">
    <ul id="searchResults" class="search-results" role="listbox" hidden></ul>
  </div>

  <nav class="views" role="tablist" aria-label="View">
    <button class="view-btn is-active" data-view="tree" role="tab" aria-selected="true">Tree</button>
    <button class="view-btn" data-view="lineage" role="tab" aria-selected="false">Lineage</button>
    <button class="view-btn" data-view="people" role="tab" aria-selected="false">People</button>
  </nav>

  <div class="topbar-actions">
    <button id="addPersonBtn" class="btn btn-primary">+ Add person</button>
    <div class="menu-wrap">
      <button id="menuBtn" class="btn btn-icon" aria-haspopup="true" aria-expanded="false" title="More">⋯</button>
      <div id="menu" class="menu" hidden>
        <button data-act="export">Export JSON…</button>
        <button data-act="import">Import JSON…</button>
        <button data-act="print">Print / save as PDF</button>
        <hr>
        <button data-act="about">About this tree</button>
        <button data-act="reset" class="danger">Reset to sample lineage</button>
      </div>
    </div>
  </div>
</header>

<!-- ============================ TREE VIEW ============================ -->
<main id="view-tree" class="view is-active">
  <div class="canvas-toolbar">
    <label class="field-inline">
      <span>Start from</span>
      <select id="rootSelect" aria-label="Tree root"></select>
    </label>
    <label class="check">
      <input type="checkbox" id="showMaternal" checked>
      <span>Maternal links</span>
    </label>
    <label class="check">
      <input type="checkbox" id="showSpouses" checked>
      <span>Spouses</span>
    </label>
    <div class="spacer"></div>
    <div class="zoom-group" role="group" aria-label="Zoom">
      <button class="btn btn-icon" data-zoom="out" title="Zoom out">−</button>
      <span id="zoomLabel">100%</span>
      <button class="btn btn-icon" data-zoom="in" title="Zoom in">+</button>
      <button class="btn" data-zoom="fit" title="Fit to screen">Fit</button>
    </div>
  </div>

  <div id="canvas" class="canvas" tabindex="0">
    <div id="stage" class="stage">
      <svg id="links" class="links" aria-hidden="true"></svg>
      <div id="nodes" class="nodes"></div>
    </div>
    <p class="canvas-hint">Drag to pan · scroll to zoom · click anyone to open their card</p>
  </div>
</main>

<!-- =========================== LINEAGE VIEW =========================== -->
<main id="view-lineage" class="view">
  <div class="lineage-head">
    <p class="muted">Direct ancestral chain, oldest first.</p>
    <label class="field-inline">
      <span>Of</span>
      <select id="lineageSelect" aria-label="Person"></select>
    </label>
  </div>
  <ol id="lineageList" class="lineage"></ol>
</main>

<!-- =========================== PEOPLE VIEW ============================ -->
<main id="view-people" class="view">
  <div class="people-head">
    <input id="peopleFilter" type="search" placeholder="Filter by name, title, note or tag…" aria-label="Filter people">
    <span id="peopleCount" class="muted"></span>
  </div>
  <div class="table-wrap">
    <table class="people-table">
      <thead>
        <tr>
          <th data-sort="name">Name</th>
          <th data-sort="title">Title</th>
          <th data-sort="birth">Born</th>
          <th data-sort="death">Died</th>
          <th data-sort="father">Father</th>
          <th data-sort="mother">Mother</th>
          <th class="col-actions"></th>
        </tr>
      </thead>
      <tbody id="peopleBody"></tbody>
    </table>
  </div>
</main>

<!-- ============================== DETAIL ============================== -->
<aside id="detail" class="detail" hidden aria-label="Person details">
  <button id="detailClose" class="detail-close" title="Close">×</button>
  <div id="detailBody"></div>
</aside>

<!-- =============================== MODAL ============================== -->
<div id="modal" class="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h2 id="modalTitle">Edit person</h2>
    <form id="personForm">
      <div class="grid2">
        <label>Name <span class="req">*</span>
          <input name="name" required autocomplete="off">
        </label>
        <label>Name in Arabic
          <input name="arabic" dir="auto" autocomplete="off">
        </label>
        <label>Title or role
          <input name="title" autocomplete="off">
        </label>
        <label>Gender
          <select name="gender">
            <option value="m">Male</option>
            <option value="f">Female</option>
            <option value="">Unspecified</option>
          </select>
        </label>
        <label>Born
          <input name="birth" placeholder="c. 570 CE" autocomplete="off">
        </label>
        <label>Died
          <input name="death" placeholder="11 AH / 632 CE" autocomplete="off">
        </label>
        <label>Father
          <select name="fatherId"></select>
        </label>
        <label>Mother
          <select name="motherId"></select>
        </label>
      </div>
      <label>Tags <small class="muted">comma separated</small>
        <input name="tags" placeholder="lineage, companion" autocomplete="off">
      </label>
      <label>Notes
        <textarea name="notes" rows="4"></textarea>
      </label>
      <p id="formError" class="form-error" hidden></p>
      <div class="modal-actions">
        <button type="button" class="btn" data-close>Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>

<!-- ============================== ABOUT =============================== -->
<div id="aboutModal" class="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="aboutTitle">
    <h2 id="aboutTitle">About this tree</h2>
    <div id="aboutBody" class="prose"></div>
    <div class="modal-actions">
      <button type="button" class="btn btn-primary" data-close>Close</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>
<input id="fileInput" type="file" accept="application/json,.json" hidden>

<script src="js/seed.js"></script>
<script src="js/store.js"></script>
<script src="js/layout.js"></script>
<script src="js/app.js"></script>
</body>
</html>
